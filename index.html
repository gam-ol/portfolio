<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Oleg — Motion Graphics Designer</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Lato', sans-serif;
      background: #F4F4F4;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAVIGATION */

    .nav-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 20px;
      background: #fff;
      border-bottom: 1px solid #ccc;
    }

    .nav-left, .nav-right {
      display: flex;
      gap: 20px;
    }

    .nav-left a, .nav-right a {
      text-decoration: none;
      font-weight: bold;
      color: #373A3E;
      border: 2px solid #373A3E;
      padding: 5px 10px;
      border-radius: 4px;
      transition: background 0.3s, color 0.3s;
    }

    .nav-left a:hover, .nav-right a:hover {
      background: #7C8591;
      color: #fff;
    }

    .active {
      background-color: #7C8591;
      color: #fff;
    }

    .nav-center {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .lottie-nav {
      width: 100px;
      height: 100px;
      cursor: pointer;
    }

    /* FOOTER */

    .footer {
      margin-top: auto;
      background: #373A3E;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <!-- MENU -->

  <nav class="nav-container">

    <div class="nav-left">
      <a href="index.html" class="active">Home</a>
      <a href="table.html">Work</a>
    </div>

    <div class="nav-center">
      <div class="lottie-nav" id="lottie-go"></div>
    </div>

    <div class="nav-right">
      <a href="article.html">My Story</a>
      <a href="Lottie.html">Experiments</a>
    </div>

  </nav>

  <!-- FOOTER -->

  <div class="footer">
    gamulinsky@gmail.com
  </div>

  <!-- LOTTIE SCRIPT -->

  <script>
    document.addEventListener('DOMContentLoaded', () => {

      function setupHoverLoopAnimation(elementId, jsonPath, startFrame, endFrame, stopFrame) {

        const el = document.getElementById(elementId);

        const anim = lottie.loadAnimation({
          container: el,
          renderer: 'svg',
          loop: false,
          autoplay: false,
          path: jsonPath
        });

        let isLooping = false;
        let stopRequested = false;

        anim.addEventListener('data_ready', () => {
          anim.goToAndStop(stopFrame, true);
        });

        el.addEventListener('mouseenter', () => {

          if (isLooping) return;

          isLooping = true;
          stopRequested = false;

          function loopPlay() {

            if (!isLooping) return;

            anim.playSegments([startFrame, endFrame], true);

            anim.addEventListener('complete', function onLoop() {

              anim.removeEventListener('complete', onLoop);

              if (!stopRequested) {
                loopPlay();
              }

              else {
                anim.goToAndStop(stopFrame, true);
                isLooping = false;
              }

            });

          }

          loopPlay();

        });

        el.addEventListener('mouseleave', () => {
          stopRequested = true;
        });

      }

      setupHoverLoopAnimation('lottie-go', 'go.json', 0, 60, 0);

    });
  </script>

</body>
</html>
