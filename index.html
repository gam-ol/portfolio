<!DOCTYPE html5> 
<html> 
<head> 
  <meta charset="utf-8"> 
  <title>Олег — Моушн дизайнер</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    nav {
      text-align: center;
      padding: 10px;
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
      color: #333;
    }

    .lottie-nav {
      display: inline-block;
      width: 100px;
      height: 100px;
      vertical-align: middle;
    }
  </style>
</head> 

<body>

  <!-- 📌 Центрированное меню с Lottie -->
  <nav>
    <a href="index.html">Главная</a>
    <a href="table.html">Таблица</a>
    <div class="lottie-nav" id="lottie-go"></div>
    <a href="article.html">Статья</a>
    <a href="Lottie.html">Lottie</a>
  </nav>

  <hr>

  <!-- 🧾 Основной контент -->
  <h1><b style="color: Blue">Олег</b></h1>
  <p>Моушн дизайнер</p>
  <img src="oleg.png" width="256" height="256" alt="Oleg">
  <p><a href="https://youtu.be/H_yvzxc7sK8?si=RdeJ0LFd8Pn6fvoN" target="_blank">Шоурил</a></p>

  <h1>Хард скиллы</h1>
  <ul>
    <li>After Effects</li>
    <li>Photoshop</li>
    <li>Illustrator</li>
    <li>Figma</li>
    <li>Unreal Engine</li>
    <li>Cinema 4D <img src="c4d.png" width="40" height="40" alt="c4d"></li>
    <li>Stable Diffusion</li>
    <li>CasparCG</li>
  </ul>

  <!-- 🎬 Скрипт Lottie: размещён в конце body -->
 <script>
  const goAnimation = lottie.loadAnimation({
    container: document.getElementById('lottie-go'),
    renderer: 'svg',
    loop: false,
    autoplay: false,
    path: 'go.json'
  });

  // Установить на 0 кадр после загрузки
  goAnimation.addEventListener('DOMLoaded', () => {
    goAnimation.goToAndStop(0, true);
  });

  const lottieElement = document.getElementById('lottie-go');

  // Наведение мышки: проиграть с 0 по 30 кадр
  lottieElement.addEventListener('mouseenter', () => {
    goAnimation.playSegments([0, 30], true);
  });

  // Увод мышки: проиграть с 30 по 60 кадр, затем остановиться на кадре 0
  lottieElement.addEventListener('mouseleave', () => {
    goAnimation.playSegments([30, 60], true);

    goAnimation.addEventListener('complete', () => {
      goAnimation.goToAndStop(0, true);
    }, { once: true }); // слушаем только один раз, чтобы не сработало лишнего
  });
</script>

</body> 
</html>
