<!DOCTYPE html5> 
<html> 
<head> 
  <meta charset="utf-8"> 
  <title>Oleg — Motion Graphics Designer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    nav {
      text-align: center;
      padding: 10px;
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
      color: #333;
    }

    .lottie-nav,
    .lottie-button {
      display: inline-block;
      width: 100px;
      height: 100px;
      vertical-align: middle;
      cursor: pointer;
    }
  </style>
</head> 

<body>
  <nav>
    <a href="index.html">Main</a>
    <a href="table.html">Work</a>
    <div class="lottie-nav" id="lottie-go"></div>
    <div class="lottie-button" id="story-btn"></div>
    <a href="Lottie.html">Lottie</a>
  </nav>

  <hr>

  <h1><b style="color: Blue">Олег</b></h1>
  <p>Моушн дизайнер</p>
  <img src="oleg.png" width="256" height="256" alt="Oleg">
  <p><a href="https://youtu.be/H_yvzxc7sK8?si=RdeJ0LFd8Pn6fvoN" target="_blank">Шоурил</a></p>

  <h1>Хард скиллы</h1>
  <ul>
    <li>After Effects</li>
    <li>Photoshop</li>
    <li>Illustrator</li>
    <li>Figma</li>
    <li>Unreal Engine</li>
    <li>Cinema 4D <img src="c4d.png" width="40" height="40" alt="c4d"></li>
    <li>Stable Diffusion</li>
    <li>CasparCG</li>
  </ul>

<script>
  // go.json логика (hover-in/hover-out, однократно)
  const el = document.getElementById('lottie-go');
  const anim = lottie.loadAnimation({
    container: el,
    renderer: 'svg',
    loop: false,
    autoplay: false,
    path: 'go.json'
  });

  anim.addEventListener('DOMLoaded', () => {
    anim.goToAndStop(60, true);
  });

  let isHover = false;

  el.addEventListener('mouseenter', () => {
    if (isHover) return;
    isHover = true;

    anim.removeEventListener('complete');
    anim.playSegments([0, 30], true);

    anim.addEventListener('complete', function onEnter() {
      if (isHover) anim.goToAndStop(30, true);
      anim.removeEventListener('complete', onEnter);
    });
  });

  el.addEventListener('mouseleave', () => {
    isHover = false;

    anim.removeEventListener('complete');
    anim.playSegments([30, 60], true);

    anim.addEventListener('complete', function onLeave() {
      if (!isHover) {
        setTimeout(() => {
          anim.stop();
          anim.goToAndStop(60, true);
        }, 50);
      }
      anim.removeEventListener('complete', onLeave);
    });
  });

  // story.json логика (loop при наведении)
  const storyEl = document.getElementById('story-btn');
  let storyAnim = lottie.loadAnimation({
    container: storyEl,
    renderer: 'svg',
    loop: false,
    autoplay: false,
    path: 'story.json'
  });

  let isLooping = false;
  let stopRequested = false;

  storyAnim.addEventListener('DOMLoaded', () => {
    storyAnim.goToAndStop(1, true);
  });

  storyEl.addEventListener('mouseenter', () => {
    if (isLooping) return;
    isLooping = true;
    stopRequested = false;

    function loopPlay() {
      if (!isLooping) return;
      storyAnim.playSegments([1, storyAnim.totalFrames - 1], true);

      storyAnim.addEventListener('complete', function onLoop() {
        storyAnim.removeEventListener('complete', onLoop);
        if (!stopRequested) {
          loopPlay(); // continue looping
        } else {
          storyAnim.goToAndStop(1, true); // stop at frame 1
          isLooping = false;
        }
      });
    }

    loopPlay();
  });

  storyEl.addEventListener('mouseleave', () => {
    stopRequested = true;
  });
</script>

</body> 
</html>
