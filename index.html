  <script>
    document.addEventListener('DOMContentLoaded', () => {
      function setupHoverLoopAnimation(elementId, jsonPath, startFrame, endFrame, stopFrame) {
        const el = document.getElementById(elementId);

        const anim = lottie.loadAnimation({
          container: el,
          renderer: 'svg',
          loop: false,
          autoplay: false,
          path: jsonPath
        });

        let isLooping = false;
        let stopRequested = false;

        anim.addEventListener('data_ready', () => {
          anim.goToAndStop(stopFrame, true);
        });

        el.addEventListener('mouseenter', () => {
          if (isLooping) return;

          isLooping = true;
          stopRequested = false;

          function loopPlay() {
            if (!isLooping) return;

            anim.playSegments([startFrame, endFrame], true);

            anim.addEventListener('complete', function onLoop() {
              anim.removeEventListener('complete', onLoop);

              if (!stopRequested) {
                loopPlay();
              } else {
                anim.goToAndStop(stopFrame, true);
                isLooping = false;
              }
            });
          }

          loopPlay();
        });

        el.addEventListener('mouseleave', () => {
          stopRequested = true;
        });
      }

      setupHoverLoopAnimation('lottie-go', 'go.json', 0, 60, 0);
    });
  </script>

</body>
