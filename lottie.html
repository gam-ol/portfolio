<!DOCTYPE html5> 
<html> 
<head> 
  <meta charset="utf-8"> 
  <title>Oleg — Motion Graphics Designer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    #bg-lottie {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vmin; /* 1:1 format, based on viewport minimum dimension */
      height: 100vmin;
      z-index: -1;
    }

    nav {
      text-align: center;
      padding: 5px;
      position: relative;
      z-index: 1; /* above background */
    }

    nav a {
      margin: 5px;
      text-decoration: none;
      font-weight: bold;
      color: #333;
    }

    .lottie-nav {
      display: inline-block;
      width: 135px;
      height: 135px;
      vertical-align: middle;
      cursor: pointer;
    }

    .lottie-button {
      display: inline-block;
      width: 200px;
      height: 100px;
      vertical-align: middle;
      cursor: pointer;
    }
  </style>
</head> 

<body>
  <!-- Фоновая Lottie -->
  <div id="bg-lottie"></div>

  <nav>
    <a href="index.html">Main</a>
    <a href="table.html">
      <div class="lottie-button" id="work-btn"></div>
    </a>
    <div class="lottie-nav" id="lottie-go"></div>
    <a href="article.html">
      <div class="lottie-button" id="story-btn"></div>
    </a>
    <a href="Lottie.html">Experiments</a>
  </nav>

  <hr>

<script>
  // Универсальная логика анимации кнопок
  function setupHoverLoopAnimation(elementId, jsonPath, startFrame, endFrame, stopFrame) {
    const el = document.getElementById(elementId);
    const anim = lottie.loadAnimation({
      container: el,
      renderer: 'svg',
      loop: false,
      autoplay: false,
      path: jsonPath
    });

    let isLooping = false;
    let stopRequested = false;

    anim.addEventListener('DOMLoaded', () => {
      anim.goToAndStop(stopFrame, true);
    });

    el.addEventListener('mouseenter', () => {
      if (isLooping) return;
      isLooping = true;
      stopRequested = false;

      function loopPlay() {
        if (!isLooping) return;
        anim.playSegments([startFrame, endFrame], true);

        anim.addEventListener('complete', function onLoop() {
          anim.removeEventListener('complete', onLoop);
          if (!stopRequested) {
            loopPlay();
          } else {
            anim.goToAndStop(stopFrame, true);
            isLooping = false;
          }
        });
      }

      loopPlay();
    });

    el.addEventListener('mouseleave', () => {
      stopRequested = true;
    });
  }

  setupHoverLoopAnimation('lottie-go', 'go.json', 0, 60, 0);
  setupHoverLoopAnimation('story-btn', 'story.json', 0, 60, 0);
  setupHoverLoopAnimation('work-btn', 'work.json', 0, 60, 0);


  // === Фоновая анимация ===
  const bgContainer = document.getElementById('bg-lottie');
  const bgAnim = lottie.loadAnimation({
    container: bgContainer,
    renderer: 'svg',
    loop: true,
    autoplay: false,
    path: 'bg.json'
  });

  let windowActive = true;
  let mouseMoving = false;
  let mouseMoveTimeout;

  // Запуск при движении мыши
  document.addEventListener('mousemove', () => {
    if (!mouseMoving && windowActive) {
      bgAnim.play();
    }
    mouseMoving = true;

    clearTimeout(mouseMoveTimeout);
    mouseMoveTimeout = setTimeout(() => {
      mouseMoving = false;
      bgAnim.pause();
    }, 300); // 300ms без движения – пауза
  });

  // Статус окна
  window.addEventListener('blur', () => {
    windowActive = false;
    bgAnim.pause();
  });

  window.addEventListener('focus', () => {
    windowActive = true;
    if (mouseMoving) {
      bgAnim.play();
    }
  });
</script>

</body> 
</html>
